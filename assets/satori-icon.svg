<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Sage master mark: single source of truth. A meditating figure (halo
    arc, head, folded arms, lotus base) drawn as glowing line art with NO
    background tile/border — transparent canvas, so only the strokes
    themselves are visible, and the glow filter traces just those lines
    rather than haloing a background square. Figure geometry is scaled
    1.25x from the original drawing (same 256x256 viewBox, bigger figure
    within it) for visibility at small sizes. Every manifest icon size
    (16/32/48/64/128/512) is rendered from this one file with sharp-cli,
    resizing to each target NN in 16 32 48 64 128 512, saved as
    assets/iconNN.png. The in-app navbar icon (Dashboard.tsx's brand-icon
    SVG) is the same markup rendered live, colored from the current theme
    accent instead of this file's fixed orange.
  -->
  <defs>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(128, 128)" filter="url(#softGlow)">
    <path d="M -37.1 -40 A 40 40 0 1 1 37.1 -40"
          fill="none"
          stroke="#fb923c"
          stroke-width="2.2"
          stroke-linecap="round"
          opacity="0.75" />

    <circle cx="0" cy="-55" r="20"
            fill="#070c12"
            stroke="#fb923c"
            stroke-width="3.75" />

    <line x1="0" y1="-32.5" x2="0" y2="12.5"
          stroke="#fb923c"
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.5" />

    <path d="M-45,-10 C-30,-27.5 -15,-32.5 0,-32.5 C15,-32.5 30,-27.5 45,-10 C57.5,8.75 40,27.5 0,27.5 C-40,27.5 -57.5,8.75 -45,-10 Z"
          fill="#070c12"
          stroke="#fb923c"
          stroke-width="3.75"
          stroke-linejoin="round" />

    <path d="M-67.5,50 C-47.5,30 -22.5,42.5 0,42.5 C22.5,42.5 47.5,30 67.5,50 C52.5,67.5 22.5,70 0,70 C-22.5,70 -52.5,67.5 -67.5,50 Z"
          fill="#070c12"
          stroke="#fb923c"
          stroke-width="3.75"
          stroke-linejoin="round" />
  </g>
</svg>
